<!DOCTYPE html>
<html lang="uk">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Звіти | Stock Manager</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main class="container-fluid dashboard-shell">
		<header class="topbar">
			<div>
				<p class="eyebrow">Аналітика</p>
				<h1>Звіти</h1>
			</div>
			<div class="topbar-actions">
				<a class="btn page-nav-button" href="index.html">← Склад</a>
				<button class="btn btn-dark refresh-button" id="refresh-reports-button" type="button"><span aria-hidden="true">↻</span> Оновити звіти</button>
			</div>
		</header>

		<div class="report-switcher" role="tablist" aria-label="Розділи звітів">
			<button class="switcher-button is-active" type="button" data-report-view="analytics" role="tab" aria-selected="true">Аналітика</button>
			<button class="switcher-button" type="button" data-report-view="receipts" role="tab" aria-selected="false">Чеки</button>
		</div>

		<div id="analytics-view" class="report-view is-visible" role="tabpanel">
		<section class="report-grid reports-page-grid">
			<article class="report-card report-card-wide">
				<div class="report-card-heading"><h2>Продажі за категоріями</h2><span>виручка</span></div>
				<div class="report-table-wrap"><table class="table report-table mb-0"><thead><tr><th>Категорія</th><th>Продано</th><th>Сума</th></tr></thead><tbody id="category-sales-body"></tbody></table></div>
			</article>
		</section>

		</div>

		<div id="receipts-view" class="report-view" role="tabpanel" hidden>
		<section class="inventory-panel receipts-panel" aria-labelledby="receipts-title">
			<div class="panel-heading"><div><p class="eyebrow">Історія операцій</p><h2 id="receipts-title">Чеки</h2></div></div>
			<div id="sales-status" class="table-status" role="status">Завантаження чеків...</div>
			<div class="table-responsive"><table class="table inventory-table mb-0"><thead><tr><th>№ чека</th><th>Клієнт</th><th>Дата</th><th class="text-end">Сума</th><th class="text-end">Дія</th></tr></thead><tbody id="sales-body"></tbody></table></div>
		</section>
		</div>

	</main>

	<dialog class="product-dialog receipt-dialog" id="receipt-dialog">
		<div class="dialog-heading"><div><p class="eyebrow">Деталі операції</p><h2 id="receipt-title">Чек</h2></div><button class="dialog-close" id="close-receipt-button" type="button" aria-label="Закрити">×</button></div>
		<div id="receipt-meta" class="receipt-meta"></div>
		<div class="report-table-wrap"><table class="table report-table"><thead><tr><th>Товар</th><th>Кількість</th><th>Ціна</th><th>Сума</th></tr></thead><tbody id="receipt-items-body"></tbody></table></div>
	</dialog>
	<script src="reports.js"></script>
</body>
</html>
